name: Android CI

# The APK goes onto a GitHub Release (push a `v*` tag), not into artifact
# storage: artifacts count against the account's monthly storage allowance and
# a 21 MB APK kept for 90 days on every push used it up. Release files do not
# count. The reports are only a few KB, so they stay as artifacts for a day.

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
        echo "SUPABASE_KEY=dummy-key" >> local.properties
        echo "GOOGLE_MAPS_API_KEY=dummy-key" >> local.properties
        echo "OPENWEATHER_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_WEATHER_API_KEY=dummy-key" >> local.properties
        echo "OPENROUTE_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_TRANSLATE_API_KEY=dummy-key" >> local.properties
        
    - name: Run unit tests
      run: ./gradlew test --stacktrace --continue
      continue-on-error: true
      
    - name: Generate test report
      if: always()
      run: ./gradlew testDebugUnitTest --continue
      continue-on-error: true
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: test-results
        retention-days: 1
        path: app/build/reports/tests/
        
    - name: Upload test coverage
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: test-coverage
        retention-days: 1
        path: app/build/reports/coverage/

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
        echo "SUPABASE_KEY=dummy-key" >> local.properties
        echo "GOOGLE_MAPS_API_KEY=dummy-key" >> local.properties
        echo "OPENWEATHER_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_WEATHER_API_KEY=dummy-key" >> local.properties
        echo "OPENROUTE_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_TRANSLATE_API_KEY=dummy-key" >> local.properties
        
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Attach the APK to a draft release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk --draft --generate-notes
        
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "SUPABASE_URL=https://dummy.supabase.co" >> local.properties
        echo "SUPABASE_KEY=dummy-key" >> local.properties
        echo "GOOGLE_MAPS_API_KEY=dummy-key" >> local.properties
        echo "OPENWEATHER_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_WEATHER_API_KEY=dummy-key" >> local.properties
        echo "OPENROUTE_API_KEY=dummy-key" >> local.properties
        echo "GOOGLE_TRANSLATE_API_KEY=dummy-key" >> local.properties
        
    - name: Run lint checks
      run: ./gradlew lint --stacktrace --continue
      continue-on-error: true
      
    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: lint-report
        retention-days: 1
        path: app/build/reports/lint-results*.html
